<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>{{ news?.title || ('COMMON.LOADING' | translate) }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  @if (loading) {
    <div class="news-image-skeleton">
      <ion-skeleton-text animated></ion-skeleton-text>
    </div>
    <div class="ion-padding">
      <ion-skeleton-text animated style="width: 75%; height: 24px; margin-bottom: 8px;"></ion-skeleton-text>
      <ion-skeleton-text animated style="width: 40%; height: 16px; margin-bottom: 24px;"></ion-skeleton-text>
      <ion-skeleton-text animated style="width: 100%; height: 14px; margin-bottom: 8px;"></ion-skeleton-text>
      <ion-skeleton-text animated style="width: 100%; height: 14px; margin-bottom: 8px;"></ion-skeleton-text>
      <ion-skeleton-text animated style="width: 80%; height: 14px;"></ion-skeleton-text>
    </div>
  } @else if (error) {
    <div class="ion-text-center ion-padding" style="margin-top: 48px;">
      <ion-icon name="wifi-outline" style="font-size: 56px; color: var(--ion-color-medium);"></ion-icon>
      <p style="color: var(--ion-color-medium);">{{ 'HOME.NO_INTERNET' | translate }}</p>
    </div>
  } @else if (news) {
    @if (news.image) {
      <img [src]="mediaBase + news.image" [alt]="news.title" class="news-hero-image" />
    }
    <div class="ion-padding">
      <h1 class="news-title">{{ news.title }}</h1>
      <p class="news-date">{{ news.published_at | date:'dd MMMM yyyy, HH:mm' }}</p>
      <div class="news-content" [innerHTML]="safeContent"></div>
    </div>
  }

</ion-content>

<style>
  .news-image-skeleton {
    width: 100%;
    height: 220px;
  }
  .news-image-skeleton ion-skeleton-text {
    width: 100%;
    height: 100%;
    margin: 0;
  }
  .news-hero-image {
    width: 100%;
    max-height: 280px;
    object-fit: cover;
    display: block;
  }
  .news-title {
    font-size: 1.4rem;
    font-weight: 700;
    margin: 0 0 6px;
    line-height: 1.3;
  }
  .news-date {
    font-size: 0.82rem;
    color: var(--ion-color-medium);
    margin: 0 0 20px;
  }
  .news-content {
    font-size: 1rem;
    line-height: 1.65;
    color: var(--ion-text-color);
  }
  .news-content p {
    margin: 0 0 12px;
  }
</style>
