<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button></ion-back-button></ion-buttons>
    <ion-title>{{ 'OQ_TIMEZONE.TITLE' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-list>
    <ion-item button (click)="openTimezoneSelector()">
      <ion-icon name="globe-outline" slot="start"></ion-icon>
      <ion-label>
        {{ 'OQ_TIMEZONE.CURRENT' | translate }}
        <ion-note>{{ tzLabel || ('OQ_TIMEZONE.NOT_SET' | translate) }}</ion-note>
      </ion-label>
      <ion-icon name="chevron-forward" slot="end"></ion-icon>
    </ion-item>
  </ion-list>
</ion-content>
<ion-footer class="ion-padding">
  <ion-button expand="block" [disabled]="saving || !tz" (click)="send()">
    @if (saving) { <ion-spinner name="crescent"></ion-spinner> }
    @else { {{ 'DEVICES.SEND_SETTINGS' | translate }} }
  </ion-button>
</ion-footer>
