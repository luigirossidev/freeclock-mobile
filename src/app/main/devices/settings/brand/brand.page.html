<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button></ion-back-button></ion-buttons>
    <ion-title>{{ 'BRAND.TITLE' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  @if (draft) {
    <ion-list>
      <ion-item>
        <ion-input
          [label]="'BRAND.TEXT' | translate"
          labelPlacement="stacked"
          [placeholder]="'BRAND.TEXT_HINT' | translate"
          [(ngModel)]="draft.text"
        ></ion-input>
      </ion-item>
    </ion-list>
  }
</ion-content>
<ion-footer class="ion-padding">
  <ion-button expand="block" [disabled]="saving || !draft" (click)="send()">
    @if (saving) { <ion-spinner name="crescent"></ion-spinner> }
    @else { {{ 'DEVICES.SEND_SETTINGS' | translate }} }
  </ion-button>
</ion-footer>
