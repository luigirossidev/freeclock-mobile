<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-back-button></ion-back-button></ion-buttons>
    <ion-title>{{ 'QUOTE_QUIZ.TITLE' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  @if (draft) {
    <ion-list>
      <ion-item>
        <ion-input [label]="'QUOTE_QUIZ.QUOTE_URL' | translate" labelPlacement="stacked" [(ngModel)]="draft.quoteUrl"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input [label]="'QUOTE_QUIZ.QUIZ_URL' | translate" labelPlacement="stacked" [(ngModel)]="draft.quizUrl"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label>{{ 'QUOTE_QUIZ.QUIZ_HOUR' | translate }}</ion-label>
      </ion-item>
      <ion-item lines="none" class="ion-justify-content-center">
        <ion-datetime
          presentation="time"
          minuteValues="0"
          hourCycle="h23"
          [value]="quizHourTime"
          (ionChange)="onQuizHourChange($event)"
        ></ion-datetime>
      </ion-item>
    </ion-list>
  }
</ion-content>
<ion-footer class="ion-padding">
  <ion-button expand="block" [disabled]="saving || !draft" (click)="send()">
    @if (saving) { <ion-spinner name="crescent"></ion-spinner> }
    @else { {{ 'DEVICES.SEND_SETTINGS' | translate }} }
  </ion-button>
</ion-footer>
